<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кабинет ученика — РепетиторПлюс</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a href="index.html">РепетиторПлюс</a>
  <a href="#" data-logout>Выйти</a>
</header>
<main>
  <h1>Кабинет ученика</h1>
  <section>
    <h2>Личные данные</h2>
    <ul id="profileInfo"><li>Загружаем профиль…</li></ul>
  </section>
  <div class="tabs">
    <button class="active" data-tab="upcoming">Предстоящие занятия</button>
    <button data-tab="past">История занятий</button>
  </div>
  <section id="tab-upcoming">
    <table>
      <thead><tr><th>Дата / время</th><th>Репетитор</th><th>Предмет</th><th>Стоимость</th><th>Статус</th><th>Действие</th></tr></thead>
      <tbody id="upcomingBody"><tr><td colspan="6">Загрузка…</td></tr></tbody>
    </table>
    <p><a href="index.html">Найти репетитора</a></p>
  </section>
  <section id="tab-past" class="hidden">
    <table>
      <thead><tr><th>Дата / время</th><th>Репетитор</th><th>Предмет</th><th>Статус</th><th>Домашнее задание</th><th>Оценка</th></tr></thead>
      <tbody id="pastBody"><tr><td colspan="6">Загрузка…</td></tr></tbody>
    </table>
  </section>
</main>
<script src="app.js"></script>
<script src="student-page.js"></script>
</body>
</html>
