<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Репетиторы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html">РепетиторПлюс</a>
    <button id="loginBtn">Войти</button>
  </header>

  <main>
    <h1>Поиск репетитора</h1>

    <fieldset>
      <legend>Фильтры</legend>
      <div class="row">
        <label>Предмет
          <select id="fSubject">
            <option value="">любой</option>
          </select>
        </label>
        <label>Цена до <input id="fPrice" type="number" placeholder="₽/час" style="width:110px"></label>
        <label>Рейтинг от <input id="fRating" type="number" step="0.1" placeholder="0–5" style="width:80px"></label>
        <label>Опыт от <input id="fExp" type="number" placeholder="лет" style="width:80px"></label>
        <button id="searchBtn">Найти</button>
      </div>
    </fieldset>

    <h2>Популярные репетиторы <small id="count"></small></h2>
    <div id="cards"></div>
  </main>

  <div class="modal" id="loginModal">
    <div class="modal-box">
      <h3>Вход (демо)</h3>
      <form id="loginForm">
        <p>
          <label>Логин<br>
            <input id="loginUser" type="text" placeholder="Логин" autocomplete="username">
          </label>
        </p>
        <p>
          <label>Пароль<br>
            <input id="loginPass" type="password" placeholder="Пароль" autocomplete="current-password">
          </label>
        </p>
        <p>
          <button type="submit">Войти</button>
          <button type="button" data-close="loginModal">Закрыть</button>
        </p>
      </form>
      <h3>Вход (демо — выбор роли)</h3>
      <p><a href="student.html">Ученик</a></p>
      <p><a href="tutor.html">Репетитор</a></p>
      <p><a href="admin.html">Администратор</a></p>
      <p><a href="registration.html">Регистрация</a></p>
    </div>
  </div>

  <div class="modal" id="bookingModal">
    <div class="modal-box">
      <h3 id="bTitle">Запись</h3>

      <div id="bStep1">
        <p>Шаг 1 из 3 — предмет и длительность</p>
        <p>Предмет: <select id="bSubject"></select></p>
        <p>Длительность:
          <select id="bDuration">
            <option value="60">60 мин</option>
            <option value="90">90 мин</option>
            <option value="120">120 мин</option>
          </select>
        </p>
        <p>Стоимость: <b id="bPriceLine">—</b></p>
      </div>

      <div id="bStep2" class="hidden">
        <p>Шаг 2 из 3 — дата и время</p>
        <div class="row" id="bDates"></div>
        <div class="row" id="bSlots"></div>
      </div>

      <div id="bStep3" class="hidden">
        <p>Шаг 3 из 3 — подтверждение</p>
        <ul id="bSummary"></ul>
      </div>

      <div class="row">
        <button id="bBack" class="hidden">Назад</button>
        <button id="bNext">Далее</button>
        <button data-close="bookingModal">Отмена</button>
      </div>
    </div>
  </div>

  <script>
    /* ---------- данные (заменить на API) ---------- */
    const tutors = [
      {id:1, name:'Анна Смирнова', desc:'ЕГЭ/ОГЭ, олимпиады', price:1200, rating:4.9, exp:8,
       subjects:[{name:'Математика',price:1200},{name:'Физика',price:1400}], education: 'ВГПУ', photo:null},
      {id:2, name:'Дмитрий Козлов', desc:'Английский, IELTS', price:1500, rating:4.8, exp:6,
       subjects:[{name:'Английский язык',price:1500}], education: 'Самарский Тракторный ПТУ', photo:null},
      {id:3, name:'Елена Волкова', desc:'Русский язык и литература', price:1100, rating:4.7, exp:10,
       subjects:[{name:'Русский язык',price:1100},{name:'Литература',price:1000}], education: 'Распиздяевка', photo:null},
      {id:4, name:'Максим Орлов', desc:'Информатика, олимпиады', price:1600, rating:5.0, exp:5,
       subjects:[{name:'Информатика',price:1600},{name:'Математика',price:1500}], education: 'Точно не ОООтмывДенег', photo:null}
    ];

    [...new Set(tutors.flatMap(t => t.subjects.map(s => s.name)))]
      .sort()
      .forEach(s => fSubject.insertAdjacentHTML('beforeend', `<option value="${s}">${s}</option>`));

    function initials(name) {
      return name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
    }

    function renderCards(list) {
      cards.innerHTML = list.map(t => `
        <div class="card">
          <div class="avatar">
            ${t.photo
              ? `<img src="${t.photo}" alt="${t.name}">`
              : initials(t.name)}
          </div>
          <div class="card-body">
            <b>${t.name}</b> — ${t.subjects.map(s => s.name).join(', ')}<br>
            ${t.desc}<br>
            ${t.education}<br>
            ★ ${t.rating} · опыт ${t.exp} лет · ${t.price} ₽/час<br>
            <button onclick="openBooking(${t.id})">Записаться на вводное</button>
          </div>
        </div>
      `).join('') || '<p>Ничего не найдено</p>';
      count.textContent = `(${list.length})`;
    }

    function applyFilters() {
      const subj = fSubject.value;
      const price = +fPrice.value || Infinity;
      const rating = +fRating.value || 0;
      const exp = +fExp.value || 0;

      const list = tutors.filter(t => {
        if (subj && !t.subjects.some(s => s.name === subj)) return false;
        if (t.price > price) return false;
        if (t.rating < rating) return false;
        if (t.exp < exp) return false;
        return true;
      });
      renderCards(list);
    }

    ['fSubject','fPrice','fRating','fExp'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('input', applyFilters);
      el.addEventListener('change', applyFilters);
    });
    searchBtn.onclick = applyFilters;
    renderCards(tutors);

    function showToast(text) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = text;
      document.body.appendChild(t);
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => {
        t.classList.remove('show');
        setTimeout(() => t.remove(), 300);
      }, 2500);
    }

    document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => {
      document.getElementById(b.dataset.close).classList.remove('active');
    });
    loginBtn.onclick = () => loginModal.classList.add('active');

    let currentTutor = null;
    let step = 1;
    let sel = { subject:'', duration:60, date:'', time:'' };
    const step3Template = bStep3.innerHTML;

    const fmtDate = iso => new Date(iso + 'T00:00:00').toLocaleDateString('ru-RU');

    function openBooking(id) {
      currentTutor = tutors.find(t => t.id === id);
      step = 1;
      sel = { subject: currentTutor.subjects[0].name, duration: 60, date: '', time: '' };

      bTitle.textContent = 'Запись к ' + currentTutor.name;
      bStep3.innerHTML = step3Template;
      bSubject.innerHTML = currentTutor.subjects.map(s =>
        `<option value="${s.name}">${s.name}</option>`).join('');
      bDuration.value = '60';
      updatePrice();
      renderDates();
      showStep(1);
      bookingModal.classList.add('active');
    }

    function updatePrice() {
      const subj = currentTutor.subjects.find(s => s.name === bSubject.value);
      bPriceLine.textContent = Math.round(subj.price * (+bDuration.value) / 60) + ' ₽';
    }
    bSubject.onchange = updatePrice;
    bDuration.onchange = updatePrice;

    function renderDates() {
      let html = '';
      for (let i = 1; i <= 7; i++) {
        const d = new Date(); d.setDate(d.getDate() + i);
        const iso = d.toISOString().slice(0, 10);
        html += `<button class="date-btn" data-date="${iso}">${d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}</button>`;
      }
      bDates.innerHTML = html;
      bDates.querySelectorAll('button').forEach(b => b.onclick = () => {
        bDates.querySelectorAll('button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        sel.date = b.dataset.date;
        renderSlots();
      });
      bDates.querySelector('button').click();
    }

    function renderSlots() {
      const times = ['10:00','12:00','14:00','16:00','18:00','20:00'];
      bSlots.innerHTML = times.map(t => `<button data-time="${t}">${t}</button>`).join('');
      bSlots.querySelectorAll('button').forEach(b => b.onclick = () => {
        bSlots.querySelectorAll('button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        sel.time = b.dataset.time;
      });
      sel.time = '';
    }

    function showStep(n) {
      step = n;
      bStep1.classList.toggle('hidden', n !== 1);
      bStep2.classList.toggle('hidden', n !== 2);
      bStep3.classList.toggle('hidden', n !== 3);
      bBack.classList.toggle('hidden', n === 1);
      bNext.textContent = n === 3 ? 'Подтвердить' : 'Далее';
    }

    function fillSummary() {
      const subj = currentTutor.subjects.find(s => s.name === sel.subject);
      bSummary.innerHTML = `
        <li>Репетитор: ${currentTutor.name}</li>
        <li>Предмет: ${sel.subject}</li>
        <li>Дата: ${fmtDate(sel.date)}</li>
        <li>Время: ${sel.time}</li>
        <li>Длительность: ${sel.duration} мин</li>
        <li>Стоимость: ${Math.round(subj.price * sel.duration / 60)} ₽</li>`;
    }

    bBack.onclick = () => showStep(step - 1);
    bNext.onclick = () => {
      if (step === 1) {
        sel.subject = bSubject.value;
        sel.duration = +bDuration.value;
        showStep(2);
      } else if (step === 2) {
        if (!sel.date || !sel.time) return alert('Выберите дату и время');
        fillSummary();
        showStep(3);
      } else {
        showToast('Бронь Успешно не написана в коде');
        bookingModal.classList.remove('active');
      }
    };
  </script>
</body>
</html>
