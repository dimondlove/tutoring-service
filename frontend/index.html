<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Репетиторы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html">РепетиторПлюс</a>
    <button id="loginBtn">Войти</button>
  </header>

  <main>
    <h1>Поиск репетитора</h1>

    <fieldset>
      <legend>Фильтры</legend>
      <div class="row">
        <label>Предмет
          <select id="fSubject">
            <option value="">любой</option>
          </select>
        </label>
        <label>Цена до <input id="fPrice" type="number" placeholder="₽/час" style="width:110px"></label>
        <label>Рейтинг от <input id="fRating" type="number" step="0.1" placeholder="0–5" style="width:80px"></label>
        <label>Опыт от <input id="fExp" type="number" placeholder="лет" style="width:80px"></label>
        <button id="searchBtn">Найти</button>
      </div>
    </fieldset>

    <h2>Популярные репетиторы <small id="count"></small></h2>
    <div id="cards"></div>
  </main>

  <div class="modal" id="loginModal">
    <div class="modal-box">
      <h3>Вход в аккаунт</h3>
      <form id="loginForm">
        <p>
          <label>E-mail<br>
            <input id="loginUser" type="email" placeholder="name@example.com" autocomplete="username" required>
          </label>
        </p>
        <p>
          <label>Пароль<br>
            <input id="loginPass" type="password" placeholder="Пароль" autocomplete="current-password" required>
          </label>
        </p>
        <p>
          <button type="submit">Войти</button>
          <button type="button" data-close="loginModal">Закрыть</button>
        </p>
      </form>
      <p><a href="registration.html">Создать аккаунт ученика</a></p>
    </div>
  </div>

  <div class="modal" id="bookingModal">
    <div class="modal-box">
      <h3 id="bTitle">Запись</h3>

      <div id="bStep1">
        <p>Шаг 1 из 3 — предмет и длительность</p>
        <p>Предмет: <select id="bSubject"></select></p>
        <p>Длительность:
          <select id="bDuration">
            <option value="30">30 мин</option>
            <option value="45">45 мин</option>
            <option value="60" selected>60 мин</option>
            <option value="90">90 мин</option>
            <option value="120">120 мин</option>
          </select>
        </p>
        <p><label><input id="bIntro" type="checkbox"> Бесплатное вводное занятие (30 минут)</label></p>
        <p>Стоимость: <b id="bPriceLine">—</b></p>
      </div>

      <div id="bStep2" class="hidden">
        <p>Шаг 2 из 3 — дата и время</p>
        <div class="row" id="bDates"></div>
        <div class="row" id="bSlots"></div>
      </div>

      <div id="bStep3" class="hidden">
        <p>Шаг 3 из 3 — подтверждение</p>
        <ul id="bSummary"></ul>
      </div>

      <div class="row">
        <button id="bBack" class="hidden">Назад</button>
        <button id="bNext">Далее</button>
        <button data-close="bookingModal">Отмена</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="index-page.js"></script>
</body>
</html>
