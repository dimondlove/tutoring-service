spring:
    application:
        name: tutoring-backend
    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tutoring}
        username: ${SPRING_DATASOURCE_USERNAME:tutoring}
        password: ${SPRING_DATASOURCE_PASSWORD:tutoring}
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
    jackson:
        datetime:
            write-dates-as-timestamps: false

app:
    timezone: Europe/Moscow
    slot-step-minutes: 30
    allowed-durations: 30,45,60,90,120
    intro-duration-minutes: 30
    min-cancel-hours: 2
    jwt:
        secret: ${JWT_SECRET:local-dev-secret-local-dev-secret-0123456789}
        ttl-minutes: 120
    cors:
        allowed-origins: http://localhost:3000,http://localhost:5173

management:
    endpoints:
        web:
            exposure:
                include: health